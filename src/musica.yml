# Faixas da galeria de música, na ordem em que aparecem.
#
# Jeito fácil: `npm run musica -- <link do YouTube>` preenche tudo sozinho
# (título, artista, álbum, ano e capa) e adiciona a faixa no fim desta lista.
#
# Campos:
#   title:   nome da faixa                                 (obrigatório)
#   artist:  artista                                       (obrigatório)
#   album:   álbum                                         (opcional)
#   year:    ano                                           (opcional)
#   playlist: chave da playlist (lista em src/site.yml)   (obrigatório)
#   cover:   arquivo da capa em src/musica/                (opcional — sem capa vira um bloco de cor)
#   youtube: id ou link do vídeo — toca pelo YouTube       (um dos dois, pra faixa tocar)
#            ou uma lista [id1, id2]: se o 1º for bloqueado, tenta o 2º
#   audio:   arquivo de áudio em src/musica/               (um dos dois, pra faixa tocar)

